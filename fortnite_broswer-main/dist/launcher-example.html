<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Riftfall — Launcher integration example</title>
  <style>
    :root{font:14px system-ui,sans-serif;color:#e8f4ff;background:#101932;color-scheme:dark}*{box-sizing:border-box}body{margin:0;display:flex;height:100vh;flex-direction:column}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid #ffffff25}h1{font-size:16px;margin:0 auto 0 0}button,a{border:1px solid #ffffff30;background:#223758;color:inherit;padding:8px 15px;border-radius:5px;cursor:pointer;text-decoration:none}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:2px solid #65e7fa}#status{color:#8eeab4;font-size:12px}iframe{flex:1;width:100%;border:0;min-height:0}footer{padding:8px 20px;color:#a6bed6;font-size:12px}
  </style>
</head>
<body>
  <header><h1>Riftfall · launcher example</h1><span id="status" role="status">Loading game…</span><button data-command="pause" disabled>Pause</button><button data-command="resume" disabled>Resume</button><button data-command="stop" disabled>Return to lobby</button><a href="./" target="_blank" rel="noopener">Open game tab ↗</a></header>
  <iframe id="game" title="Riftfall game" sandbox="allow-scripts allow-same-origin allow-pointer-lock" allow="fullscreen" allowfullscreen></iframe>
  <footer>This example embeds the standalone game and exchanges origin-checked pause, resume and match events.</footer>
  <script>
    const frame = document.getElementById('game');
    const gameURL = new URL('./', location.href);
    gameURL.searchParams.set('parentOrigin', location.origin);
    window.addEventListener('message', event => {
      if (event.source !== frame.contentWindow || event.origin !== gameURL.origin || event.data?.version !== 1 || !event.data.type?.startsWith('riftfall:')) return;
      document.getElementById('status').textContent = event.data.type.replace('riftfall:', 'Game: ');
      document.querySelectorAll('[data-command]').forEach(button => button.disabled = false);
    });
    document.querySelectorAll('[data-command]').forEach(button => button.addEventListener('click', () => {
      frame.contentWindow.postMessage({ type: 'riftfall:' + button.dataset.command, version: 1 }, gameURL.origin);
    }));
    frame.src = gameURL.href;
  </script>
</body>
</html>
